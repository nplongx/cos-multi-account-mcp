services:
  contextforge:
    image: cos-contextforge:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cos-contextforge
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 127.0.0.1
      PORT: "4444"
      DATABASE_URL: sqlite:////data/mcp.db
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      AUTH_REQUIRED: "true"
      MCP_CLIENT_AUTH_ENABLED: "true"
      MCP_OAUTH_EMAIL_CLAIM: ${MCP_OAUTH_EMAIL_CLAIM:?Set MCP_OAUTH_EMAIL_CLAIM in .env}
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      MCPGATEWAY_BULK_IMPORT_ENABLED: "false"
      MCPGATEWAY_A2A_ENABLED: "false"
      MCPGATEWAY_CATALOG_ENABLED: "true"
      SSRF_ALLOW_LOCALHOST: "true"
      SECURE_COOKIES: "false"
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "600"
    volumes:
      - cos-contextforge-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cos-contextforge-data:
    name: cos-contextforge-data
    external: true
