<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text{font-family:'DejaVu Sans',sans-serif;fill:#14243b}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#52647a}.h{font-size:23px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#52647a}.tag{font-size:14px;font-weight:700;letter-spacing:1px}.code{font-size:15px;font-family:'DejaVu Sans Mono',monospace}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#4c6b8a" stroke-width="1.8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f3f6fb"/>
  <text x="76" y="78" class="title">Auth0: API audience and verified identity claim</text>
  <text x="78" y="114" class="sub">The exact metadata resource ties the Auth0 token to the intended ContextForge Virtual Server</text>

  <rect x="70" y="205" width="690" height="210" rx="18" fill="#ffffff" stroke="#c9d5e4" stroke-width="2"/>
  <rect x="70" y="205" width="690" height="12" rx="6" fill="#7b5aab"/>
  <text x="108" y="262" class="tag" fill="#7b5aab">1 · AUTH0 API</text>
  <text x="108" y="308" class="h">Identifier = metadata.resource</text>
  <text x="108" y="348" class="body">Signing algorithm: RS256 · Scope: mcp:connect</text>
  <text x="108" y="382" class="small">OIDC scopes: openid profile email · RFC 9068 when supported</text>

  <rect x="840" y="205" width="690" height="210" rx="18" fill="#ffffff" stroke="#c9d5e4" stroke-width="2"/>
  <rect x="840" y="205" width="690" height="12" rx="6" fill="#d97735"/>
  <text x="878" y="262" class="tag" fill="#b55d24">2 · GOOGLE SOCIAL CONNECTION</text>
  <text x="878" y="308" class="h">Use an OAuth client you own</text>
  <text x="878" y="348" class="body">Copy the callback URI shown by Auth0 exactly</text>
  <text x="878" y="382" class="small">Verify email and email_verified are returned by the provider</text>

  <path d="M415 415 V480 H800 V510" fill="none" stroke="#4c6b8a" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1185 415 V480 H800" fill="none" stroke="#4c6b8a" stroke-width="3"/>

  <rect x="305" y="520" width="990" height="175" rx="18" fill="#ffffff" stroke="#c9d5e4" stroke-width="2"/>
  <rect x="305" y="520" width="990" height="12" rx="6" fill="#19836c"/>
  <text x="345" y="578" class="tag" fill="#19836c">3 · POST-LOGIN ACTION — ATTACH TO LOGIN FLOW</text>
  <text x="345" y="623" class="h">Only for the exact MCP audience</text>
  <text x="345" y="660" class="body">Reject missing/unverified email · emit the lowercased email under a namespaced claim</text>
  <text x="345" y="686" class="small">Action secrets: MCP_RESOURCE_IDENTIFIER and MCP_EMAIL_CLAIM · never log tokens</text>

  <path d="M800 695 V744" fill="none" stroke="#4c6b8a" stroke-width="3" marker-end="url(#a)"/>
  <rect x="70" y="755" width="1460" height="96" rx="16" fill="#e9eef6" stroke="#c9d5e4"/>
  <text x="104" y="795" class="tag" fill="#36516f">4 · CONTEXTFORGE MAPPING</text>
  <text x="104" y="829" class="body">MCP_OAUTH_EMAIL_CLAIM must match MCP_EMAIL_CLAIM exactly; the email must resolve to an active local user with team membership.</text>
</svg>
